<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="#" />
  <title>AI Workspace</title>
  <style></style>
  <script src="scripts/jquery/jquery-3.7.1.min.js"></script>
  <script src="scripts/require.js"></script>
  <script src="scripts/data-util.js"></script>
  <script src="https://js.puter.com/v2/"></script>
  <script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
  }
  </script>
  <script type="module" src="scripts/gen-ai.js"></script>
  <script>
    const PROMPT_CACHE_SIZE = 5;

    if (parent.dataCache === undefined)
      parent.dataCache = {};

    if (parent.dataCache["prompts"] == undefined)
      parent.dataCache["prompts"] = {};

    var p_cache = parent.dataCache["prompts"];

    const encodeUnicode = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
    const decodeUnicode = (str) => new TextDecoder().decode(Uint8Array.from(atob(str), c => c.charCodeAt(0)));

    window.onload = function () {
      toggleHead($('#pHead'), $('#pHeadImg'));
      loadModels();
      updateOptions();
      var p = getParamValue("data");
      document.getElementById('prompt').value = p;
      getAIResponse();
    }

    window.onunload = function () {
      if (parent.stopAudio)
        parent.stopAudio();
    }

    function run_ai(){
      var genai = $("#optionsGenAI").val();
      var flags = {};
      flags["IMAGE"] = $("#chkPartImage").is(":checked");
      flags["HTML"] = $("#chkPartHTML").is(":checked");

      if(genai == "google-ai"){
        openGoogleAISearch(document.getElementById('prompt').value.trim());
      }
      else{
        getAIResponse(genai, flags);
      }
    }

    async function getAIResponse(genai, flags) {
      const inputPrompt = document.getElementById('prompt').value.trim();
      if (inputPrompt == undefined || inputPrompt == "undefined") {
        return;
      }
      const outputDiv = document.getElementById('output');
      const mDiv = document.getElementById('pLastRun');

      // Valdiate prmpt not empty
      if (inputPrompt === '') {
        outputDiv.innerText = `
        It looks like your message came through blank. How can I help today? If you’re not sure where to start, here are some quick ideas:

- Explain a concept or topic
- Help write, edit, or summarize text
- Plan a project or schedule
- troubleshoot a tech issue
- translate or compare information

Tell me what you’d like to do, or paste any details you have.`;
        return;
      }

      // See if cache already has the prompt
      var cacheKey = encodeUnicode(inputPrompt);
      if (p_cache[cacheKey] != undefined) {
        outputDiv.innerText = p_cache[cacheKey];
        mDiv.innerText = 'Response from cache';
        return;
      }

      if (inputPrompt.includes('Target Language:ur') ||
        inputPrompt.includes('Target Language:ar')) {
        outputDiv.style.direction = 'rtl';
      } else {
        outputDiv.style.direction = 'ltr';
      }

      mDiv.innerText = 'Running...';
      outputDiv.innerText = "Researching...."
      const start = performance.now();
      var timer = setInterval(() => {
        outputDiv.innerText = `Researching... ${((performance.now() - start) / 1000).toFixed(2)} seconds`;
      }, 1000);

      try {
        var model = $('#selModels').val();
        var response = '';
        switch(genai){

          case "gemini":
          {
            response = await window.runGeminiGenAISearch(
              $('#apiKey').val(),
              $('#selModels').val(),
              flags,
              document.getElementById('prompt').value.trim()
            )
            .catch(err => response = err);
          }
          break;

          case "puter": 
          default:
          {
            response = model == 'default' ?
              await puter.ai.chat(inputPrompt) :
              await puter.ai.chat(inputPrompt, { model: model });
          }
          break;
        }

        outputDiv.innerHTML = aiResponseToHTML(response);

        const end = performance.now();
        mDiv.innerText = `Last run took: ${((end - start) / 1000).toFixed(2)} seconds`;
        clearInterval(timer);
      }
      catch (err) {
        mDiv.innerText = 'Last run: Error';
        outputDiv.innerText = `Error: ${err.message}`;
        clearInterval(timer);
      }
    }

    function aiResponseToHTML(result){
    
      var htmlResponse = $("<div/>");

      if(typeof result=="string"){
        htmlResponse.append(result);  
      }
      else // Check Image Part
      if(result.response && result.response.candidates && 
         result.response.candidates[0].content && 
         result.response.candidates[0].content.parts &&
        result.response.candidates[0].content.parts.length > 0){

        // Iterate through response parts to find the image data
        for (const part of result.response.candidates[0].content.parts) {
          if (part.inlineData) {
            const imageData = part.inlineData.data; // Base64 encoded string
            
            //const buffer = Buffer.from(imageData, "base64");
            //fs.writeFileSync("generated_image.png", buffer);
            
            htmlResponse.append(`<img style="width:80%" src="${imageData}" />`);
          } else if (part.text) {
            htmlResponse.append(`${part.text}`);  
          }
        }
      }
      else {
        if(response.text){
          outText = response.text();
        }
        else if(response.response && response.response.text){
           outText = response.response.text(); 
        }
        else if (response.message && response.message.content && response.message.content.length > 0) {
          outText = '';
          $.each(response.message.content, (i, v) => {
            if (v.type == 'text') {
              outText += v.text;
            }
          });
        }
        htmlResponse.append(outText);
      }

      return htmlResponse.html();
    }

    function updateCache(key, value) {
      if (key) {
        if (p_cache[key] == undefined) {
          if (Object.keys(p_cache).length + 1 >= PROMPT_CACHE_SIZE) {
            delete p_cache[Object.keys(p_cache)[0]];
          }
          p_cache[key] = value
        }
      }
    }

    function updateModelOptions(models) {
      var sel = $("#selModels")[0];
      models.forEach(model => {
        var option = document.createElement("option");
        option.text = model.id;
        option.value = model.id;
        if (model.id == 'default')
          option.selected = true;
        sel.add(option);
      });
    }

    function loadModels() {

      var models = parent.dataCache["models"];
      if (models != undefined) {
        updateModelOptions(models);
      } else {
        puter.ai.listModels()
          .then(models => {
            models.push({ id: "default", name: "Default" });
            parent.dataCache["models"] = models;
            updateModelOptions(models);
          })
          .catch(err => {
            console.error("Error loading models: ", err);
          });
      }

      puter.ai.listModels().then(models => {

        var sel = $("#selModels")[0];
        models.forEach(model => {
          var option = document.createElement("option");
          option.text = model.id;
          option.value = model.id;
          sel.add(option);
        });
      }).catch(err => {
        console.error("Error loading models: ", err);
      });
    }

    function updateOptions() {
      var sel = $("#selPrompts")[0];

      //Add default
      $("#selPrompts").empty();
      var o = document.createElement("option");
      o.text = "none"; o.value = ""; o.id = o.text;
      sel.add(o);
      for (const [k, v] of Object.entries(p_cache)) {
        var optionExists = sel.options.namedItem(k) !== null;
        if (!optionExists) {
          if (sel.options.length >= PROMPT_CACHE_SIZE) {
            sel.remove(0);
          }
          var option = document.createElement("option");
          option.text = k.length > 30 ? k.substring(0, 30) + '...' : k;
          option.value = k;
          option.id = k;
          sel.add(option);
        }
      }
    }

    function playResponse() {

      if (parent.playTextAll) {
        const inputPrompt = document.getElementById('prompt').value;
        var lang = 'en-US'
        if (inputPrompt.includes('Target Language:ur'))
          lang = 'ur-PK';
        if (inputPrompt.includes('Target Language:ar'))
          lang = 'ar-SA';
        if (inputPrompt.includes('Target Language:hi'))
          lang = 'hi-IN';
      }

      const outputDiv = document.getElementById('output');
      parent.playTextAll(outputDiv.innerText, lang);
    }

    function addPrompt() {
      const inputPrompt = document.getElementById('prompt').value.trim();
      if (inputPrompt === '')
        return;
      const outputDiv = document.getElementById('output');
      var cacheKey = encodeUnicode(inputPrompt);
      updateCache(cacheKey, outputDiv.innerText);
      updateOptions();
    }

    function removePrompt() {
      var val = $("#selPrompts").val();
      if (val === 'default')
        return;
      delete p_cache[val];
      updateOptions();
    } 
  </script>
</head>

<body>
  <div style="text-align:center;margin:auto;cursor:pointer;" title="toggle"
    onclick="toggleHead($('#pHead'), $('#pHeadImg'))">
    <img id="pHeadImg" src="images/up.png" width="12px;" alt="toggle" />
  </div>
  <div id="pHead" style="display:block;padding-bottom:10px;width:100%">
    <label id="pLastRun" style="float:right;margin-right:10px;"></label>
    <div style="margin-left:10px;padding-bottom:6px;padding-top:6px;display:inline-block">
      Gen AI:
      <select id="optionsGenAI">
        <option value="google-ai">Google AI (Browser)</option>
        <option value="gemini">Gemini</option>
        <option value="puter">Puter</option>
      </select>
      <button style="margin:auto;margin-left:10px;text-align:left;" onclick="run_ai()">Run</button>
      <span>
				<input id="chkPartImage" type="Checkbox" checked>
        <label>Image</label>
      </span>
      <span>
				<input id="chkPartHTML" type="Checkbox" checked>
        <label>HTML</label>
      </span>
    </div>
    <div style="margin-left:10px;padding-bottom:6px;padding-top:10px;">
      API KEY:
      <input id="apiKey" type="password" maxlength="128"/>
    </div>
    <div style="margin-left:10px;padding-bottom:6px;padding-top:6px;">
      Models:
      <select id="selModels"></select>
    </div>
    <div style="margin-left:10px;padding-bottom:6px;">
      Prompts:
      <select id="selPrompts" onchange="$('#prompt').val(decodeUnicode(this.value))"></select>
      <button onclick="addPrompt()">+</button>
      <button onclick="removePrompt(this)">-</button>
    </div>
    <textarea id="prompt" rows="4" cols="1" style="margin:auto;
             margin-left:10px;
             display:block;
             width:90%;
             text-align:left;">
      Your prompt here
    </textarea>
  </div>
  <img src="images/speech-enabled.png" 
        style="margin:auto;margin-left: 10px;width:18px;" 
        onclick="playResponse()" />
  <div id="output" style="display:block;left:0;">&nbsp;</div>
</body>

</html>
