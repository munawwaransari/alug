<html>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, user-scalable=yes" />
	<head>
		<title>Arabic Noun & Verb patterns</title>
		<link rel="shortcut icon" href="#" />
		<style>
			.kalima {
				text-align: center;
				margin:auto;
				width: 56px;
				padding: 4px;
				font-size: 24px;
			}
			.pDiv{
				text-align: center;
				margin:auto;
				width: 100%;
				padding: 10px;
			}
			.enText {
				font-size: 18px;
			}
			
			.arText{
				font-size: 26px;
			}
			
			#display {
				font-size: 30px;
			}
		</style>
		<script src="scripts/jquery/jquery-3.7.1.min.js"></script>
		<script src="scripts/data-util.js"></script>
		<script src="scripts/pos.js"></script>
		<script>			
			var sel = {};
			var pat_kalimas = [];
			var posTitles = {};
			var posAPIInstance;
			window.onload = function(){
				posAPIInstance = new posAPI(getLocationPath(), function(msg, err){
					if(err){
						console.log("Failed to initialize pos api");
						return;
					}
					setTimeout(function(){
						getPatternsFromNounInfo(posAPIInstance.getNounInfo());
						getPatternsFromverbInfo("Triliteral", posAPIInstance.getVerbInfo("V1"));
						getPatternsFromverbInfo("Extended", posAPIInstance.getVerbInfo("V2"));
						getPatternsFromverbInfo("Quadriliteral", posAPIInstance.getVerbInfo("V3"));
						loadPosTitles();
					},500);
				});				
			}

			function isQuadriliteralRoot(root){
				var r = [...arRemovePunct(root)];
				return r.filter((x) => x=='ل').length > 1 || 
					   r.filter((x) => x=='ع').length > 1; 
			}

			function getPatternsFromNounInfo(nounInfo){
				var nounInfo = posAPIInstance.getNounInfo();
				for(const [key, val] of Object.entries(nounInfo)){
					val.xforms.map(function(x){
						if(x.form !== 'فعل'){
							var isQuadriliteral = isQuadriliteralRoot(x.form);
							updatePosTitles(posTitles, isQuadriliteral ? "Quadriliteral":"Triliteral", x);
						}
					});;
				}
			}

			function getPatternsFromverbInfo(posTitle, verbInfo){
				for(const [key, val] of Object.entries(verbInfo)){
					for(const [key2, val2] of Object.entries(val.xform)){
						if(val2.pos === "verb"){
							updatePosTitles(posTitles, posTitle, val2);
						}
						else if(val2.pos === "noun"){
							updatePosTitles(posTitles, posTitle, val2);
						}
					}
				}
			}

			function updatePosTitles(posTitles, key, val){
				if(posTitles[key] == undefined)
					posTitles[key] = {};
				var enVal = val.en ?? "noun";
				var enValTitle = toTitleCase(enVal);
				if(posTitles[key][enVal] == undefined)
					posTitles[key][enVal] = {
						title: toTitleCase(enVal),
						patterns: [],
						patternsInfo: {}
					};
				if(posTitles[key][enVal].title !== enValTitle)
					posTitles[key][enVal].title = enValTitle;
				posTitles[key][enVal].patterns.push(val.form);
				posTitles[key][enVal].patternsInfo[val.form] = val;
			}
			
			function loadPosTitles(){
				var root = $("#roots option:selected").text();
				var posSelect = $("#pos");
				posSelect.empty();
				Object.keys(posTitles[root]).sort().every((k)=>{
					posSelect.append($(`<option value="${k}">${posTitles[root][k].title}</option>`));
					return true;
				});
				posSelect.trigger("change");
			}

			function loadPatterns(){
				var rootTxt = $("#roots option:selected").text();
				$("#patterns").empty();
				$("#patterns").append('<option value="all">Show All</option>');
				var pos = $("#pos").val();
				var patterns= posTitles[rootTxt][pos].patterns;
				patterns?.every(function(n, i){
					$("#patterns").append('<option value="'+n+'">'+n+'</option>');
					return true;
				});
				$("#patterns").trigger("change");
			}	
			
			function loadPatternKalimas(){
				var root = $("#roots").val();
				var patSelection = $("#patterns").val();
				var pat = patSelection == 'all' ? 
					$("#roots").val() : arRemovePunct($("#patterns").val());
				pat_kalimas = [];
				$("#pDiv").empty();
				for(var i=0; i < pat.length; i++){
					
					id = pat[i] === 'ف' ? "fa_kalima" :
						 pat[i] === 'ع' && $("#ain_kalima").length > 0? "ain2_kalima" :
						 pat[i] === 'ع' ? "ain_kalima" :
						 pat[i] === 'ل' && $("#laam_kalima").length == 0 ? "laam_kalima" : 
						 (i+1) === pat.length ? "laam2_kalima" : "extra_kalima_"+i;
					
					//Add pattern letter
					$("#pDiv").append(`
					<select id="${id}" class="kalima" 
					        onchange="applyPatterBasedOnSelection()"
				            ${id.startsWith('extra_') ? ' disabled ':''}/></select>`);
					loadKalimaLists("#"+id);
					
					//select value
					var val = getKalimaSelection(id, pat[i]=='x' ? 'ل':pat[i]);
					$("#"+id).val(val);					
				}
				applyPatterBasedOnSelection(patSelection);
			}
			
			function applyPatterBasedOnSelection(patSelection){
				var root = '';
				$("#display").empty();
				var sel = patSelection ?? $("#patterns").val();
				if(sel !== 'all'){
					root = applyPattern(sel);
				}
				else{
					$("#patterns option[value!=all]")
					.each((i,o)=>{
						root = applyPattern(o.value)	
					})
				}

				//Add Google AI Search with prompt
				$("#display").append(`
					<div style="margin-bottom:0">
						<a href="#" style="text-decoration:none; cursor:pointer;"
							onclick="openGoogleAISearch(
								getPromptFromKey(['Patterns'], 
									{'0': ['${root}', \`${$("#display span").text()}\`]}, true));">
							More
						</a>
					</div>
				`);
			}

			function getKalimaSelection(id, val){
				var v = val;
				if(id.includes("kalima") && sel[id] !== undefined){
						v = sel[id];		
				}	
				return v;
			}
			
			function loadKalimaLists(id){
				$(id).empty();
				letters.every(function(code){
					$(id).append('<option value="'+code+'">'+code+'</option>');
					return true;
				});
			}
			
			function applyPattern(pattern){
				var rootTxt = $("#roots option:selected").text();
				var pos = $("#pos").val();
				var root = $('#fa_kalima').val()+
						   $('#ain_kalima').val()+
						   ($('#ain2_kalima').length > 0 ? $('#ain2_kalima').val(): '')+
						   $('#laam_kalima').val()+
						   ($('#laam2_kalima').length > 0 ? $('#laam2_kalima').val(): '');
				var pInfo = posTitles[rootTxt][pos].patternsInfo[pattern];
				var word = posAPIInstance.applyPattern(root, pInfo);
				$("#display").append(`
				<span style="display:inline-flex;margin:10px;border:2px solid gainsboro;">
					${word}
				</span>`);
				return root;
			}
			
			var letters = [    "ء",    "ا",    "ب",    "ت",    "ث",    "ج",    "ح",    "خ",    "د",    "ذ",    "ر",    "ز",    "س",    "ش",    "ص",    "ض",    "ط",    "ظ",    "ع",    "غ",    "ف",    "ق",    "ك",    "ل",    "م",    "ن",    "و",    "ه",    "ي"];
		</script>
	</head>
	<body style="display:flex;justify-content: center;flex-direction: column;">
		<div class="pDiv">
			<label class="enText">Root:</label>
			<select id="roots" onchange="loadPosTitles();">
				<option value="فعل">Triliteral</option>
				<option value="فعلx">Extended</option>
				<option value="فعلx">Quadriliteral</option>
			</select>
			&nbsp;
			<label class="enText">Category:</label>
			<select id="pos" onchange="loadPatterns();"></select>
			&nbsp;
			<label class="enText">Patterns:</label>
			<select id="patterns" class="arText" onchange="loadPatternKalimas()" ></select>
		</div>
		<div id="pDiv" class="pDiv" style="direction: rtl"></div>
		<div id="display" class="pDiv" style="direction: rtl">
		</div>
	</body>
</html>
