<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
	<link rel="stylesheet" type="text/css" href="styles/card-styles.css" media="screen">
	<title>Image Generation</title>
	<script src="scripts/jquery/jquery-3.7.1.min.js"></script>
	<script src="scripts/data-util.js"></script>
	<style>
		#imageContainer {
			justify-content:center;
			align-content: center;
		}

		#imageContainer div {
			flex-direction: column; 
			justify-content:center;
			align-items:center;
			display:flex;
			padding: 6;
			margin: 2px;
			border: solid 2px gray;
			float: left;
		}

		#imageContainer img {
			padding: 0;
			margin: 0;
		}
		#imageContainer span {
			padding: 0;
			margin: 0;
		}
	</style>
	<script>
		window.onload = () => {
			var cat = getParamValue("action");
			if(cat) $("input:first").val(cat);
			var kw = getParamValue("data");
			if(kw) $("input:last").val(kw);
			$(`button:contains('Search Images')`).trigger('click');
		}

		function searchFreeImages(cat, kw){
			var c = cat ?? $("input:first").val();
			var k = kw ?? $("input:last").val();
			if(c || k)
			getFreeImages(k,c, {width:200, height:'auto'})
			.then((data)=>{
				var container = $("#imageContainer")
				container.empty();
				if(data.hits.length > 0){
					data.hits.every((h)=>{
						var img = h.previewURL ?? h.userImageURL ?? h.webformatURL;
						container.append($(`
						<div>
							<img src="${img}"></img><br/>
							<span>${h.tags?.split(",")[0]}</span>
						</div>`));
						return true;
					});
				}else{
					container.append(`<p style="padding:10px;font-size:12px;">Did not find any free image for category: '${c}' and keyword:'${k}'</p>`);
				}
			});
		}
	</script>
</head>
  <body>
	<div style="align-content: center;display: flex;">
		<span>category:
			<input style="width:120px;margin:auto;" value=""  list="cat-list"/>
			<datalist id="cat-list">
				<option>Animmals</option>
				<option>Business</option>
				<option>Education</option>
				<option>Fianancial</option>
				<option>Industry</option>
				<option>Media</option>
				<option>Monetary</option>
				<option>Nature</option>
				<option>Politics</option>
				<option>Science</option>
				<option>Technology</option>
			</datalist>
		</span>&nbsp;&nbsp;
		<span>keyword:<input style="width:120px;margin:auto;" value=""/></span>&nbsp;&nbsp;
		<button onclick="searchFreeImages()">Search Images</button>
	</div>
	<div style="align-content: center;text-align: center;">
	<a href="https://pixabay.com/" target="_blank"
			style="width:fit-content;margin:auto;padding:4px;font-size:10px;line-height:1.7;color:#555;display:flex;justify-content:center;align-items:center;text-decoration:none;">
        	Free images by Pixabay
    </a>
	</div>
	<div id="imageContainer"></div>
  </body>
</html>
