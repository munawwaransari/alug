<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
	<title>Draw Arabic letter</title>
	<style>
	#can-img{
	  width: 100%;
	  position: relative;
	  left: 0;
	  top: 30;
	  display: none;
	}
	
	#can {
	  width: 100%;
	  position: absolute;
	  top: 32px;
	  left: 0px;
	  background-color: #AAA;
	  touch-action: none;
	}

	.colors {
	  left:0;
	  border: 1px solid black;
	  display: inline-flex;
	}

	.swatch {
	  min-width: 16px;
	  min-height: 16px;
	  max-width: 16px;
	  border: 1px solid black;
	  display: inline-block;
	  margin: 2px;
	  cursor: pointer;

	}

	.highlight {
	  border: 1px solid red;
	}
	
	
	.can-container{
		width: 100%;
		height: 30%;
	}
	
	#ocrResult{
		top: 380px;
		position: relative;
		padding: 20px;
		font-size: 28px;
		text-align: center;
		width: 100%;
		background-color:#F5F9AA;
		box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
	}
	
	.btn {
		margin-left : 4px;
	}
	</style>
	<script src="scripts/jquery/jquery-3.7.1.min.js"></script>
	<script src='https://unpkg.com/tesseract.js@7.0.0/dist/tesseract.min.js'></script>
	<script src='scripts/data-util.js'></script>
	<script>
	const alpha = "ءابتثجحخدذرزسشصضطظعغفقكلمنهوي";	
	const maxHeight = 400;
	// size of drawing and its starting background colour
	const drawingInfo = {
	  width:  innerWidth, //384 ,
	  height: maxHeight, //160,
	  bgColor: "white",
	}
	const playIcon = '\u25b6';//▶
    const stopIcon = '\u23F9';//⏹
	const brushSizes = [8, 12, 16, 20];
	const colors = "green,blue,white,black".split(",");
	var currentColor = "blue";
	var currentWidth = 14;
	var currentSelectBrush;
	var currentSelectColor;
	var colorSel;
	var canvas, mouse, ctx;
	var practiceMode = false;
	var practiceAlpha = undefined;
	var practiceMatched = false;
	var randomAlpha = 0;

	const animLookup = {

		'ب':'https://i.pinimg.com/originals/8f/26/45/8f2645251e4c1db5b87a2c3cbd94cbf2.gif',
		'ت':'https://i.pinimg.com/originals/b6/f0/86/b6f08604c988690a20f602e158ac0b1f.gif',
		'ث':'https://i.pinimg.com/originals/52/8b/40/528b40276464937fb2abffa9a88ac6ab.gif',
		'ج':'https://i.pinimg.com/originals/77/f2/4a/77f24a8226187ede04cd389dcc9d0e98.gif',
		'ح':'https://i.pinimg.com/originals/64/bd/1e/64bd1ecd1075e516263d4dda5b5a730b.gif',
		'د':'https://i.pinimg.com/originals/80/ea/3d/80ea3d5ca28f372f30b9609e307b288c.gif',
		'ذ':'https://i.pinimg.com/originals/8a/9c/8c/8a9c8c3c7b882d960eba3ce903caeae3.gif',
		'ر':'https://i.pinimg.com/originals/97/08/71/970871e5886b0b4690241117b0e2a814.gif',
		'ز':'https://i.pinimg.com/originals/0b/1e/83/0b1e83a8644c7a90014910e183e353c7.gif',
		'س':'https://i.pinimg.com/originals/7a/9b/be/7a9bbe922f3ac598a3e3853149aa4c42.gif',
		'ش':'https://i.pinimg.com/originals/f2/a3/20/f2a3209bafd115b3c38077c8e464366d.gif',
		'ض':'https://i.pinimg.com/originals/ab/2f/90/ab2f9012248492c588238e67bd426813.gif',
		'ط':'https://i.pinimg.com/originals/1c/8a/92/1c8a92ee70a300508ff7880f103355ff.gif',
		'ظ':'https://i.pinimg.com/originals/75/2c/c9/752cc906412abb6a148d6d0180a592f6.gif',
		'ع':'https://i.pinimg.com/originals/d8/a0/2d/d8a02d67ac919dc73b39d3398cb34a92.gif',
		'غ':'https://i.pinimg.com/originals/85/9d/e5/859de5d62c5c0e3b6cadde5144134f5b.gif',
		'ك':'https://i.pinimg.com/originals/d1/42/ba/d142bad4668a267cfcc579708fa1d20f.gif',
		'ق':'https://i.pinimg.com/originals/58/07/36/580736891e92239322983d083548c2f2.gif',
		'ل':'https://i.pinimg.com/originals/5d/71/01/5d71013f527c1019728e226d68ae828d.gif',
		'م':'https://i.pinimg.com/originals/8a/19/43/8a19436e5af4e3699a9bcbab6f6d1b85.gif',
		'ن':'https://i.pinimg.com/originals/78/cb/71/78cb719a5ba8c00f3500ca041c6ea7b8.gif',
		'و':'https://i.pinimg.com/originals/26/02/3a/26023a15f4a6e307ba48ee886fb23fc5.gif',
		'ه':'https://i.pinimg.com/originals/f4/b7/e1/f4b7e1c5b01f0087756fab870aca6e93.gif'
	}
	window.onload = function(){
		init();
		requestAnimationFrame(update);

		//Fill leter selection
		var sel = $("#can-letters"); 
		for(const char of alpha){
			sel.append($(`<option value='${char}'>${char}</option>`));
		}
		
	}
	
	function init(){

		colorSel = document.getElementById("colorSel");
		colors.forEach((color, i) => {
		  var swatch = document.createElement("span");
		  swatch.className = "swatch";
		  swatch.style.backgroundColor = color;
		  if (currentColor === color) {
			swatch.className = "swatch highlight";
			currentSelectColor = swatch;
		  } else {
			swatch.className = "swatch";
		  }
		  swatch.addEventListener("click", (e) => {
			currentSelectColor.className = "swatch";
			currentColor = e.target.style.backgroundColor;
			currentSelectColor = e.target;
			currentSelectColor.className = "swatch highlight";
		  });
		  colorSel.appendChild(swatch);
		})
		brushSizes.forEach((brushSize, i) => {
		  var brush = document.createElement("canvas");
		  brush.width = 16;
		  brush.height = 16;
		  brush.ctx = brush.getContext("2d");
		  brush.ctx.beginPath();
		  brush.ctx.arc(8, 8, brushSize / 2, 0, Math.PI * 2);
		  brush.ctx.fill();
		  brush.brushSize = brushSize;
		  if (currentWidth === brushSize) {
			brush.className = "swatch highlight";
			currentSelectBrush = brush;
		  } else {
			brush.className = "swatch";
		  }

		  brush.addEventListener("click", (e) => {
			currentSelectBrush.className = "swatch";
			currentSelectBrush = e.target;
			currentSelectBrush.className = "swatch highlight";
			currentWidth = e.target.brushSize;

		  });
		  colorSel.appendChild(brush);
		})

		canvas = document.getElementById("can");
		mouse = createMouse().start(canvas, true);
		ctx = canvas.getContext("2d");

		//*** Add Image Button
		addButton('Img', function() {
			let imgUrl = prompt("Enter image url:");
			$("#can-img").prop('src', imgUrl);
		});
		
		//*** Add Clear Buttons
		addButton('Clear',  function() {
			location.reload();
		});
		
		//*** Add Convert Buttons
		addButton('OCR', function() {
			$("#ocrResult").html('Converting...');
			var img = document.getElementById("can-img");
			if(img.src !== ''){
				runOCR(img.src);
			}else{
				canvas.toBlob(function(blob){
					canvasToText(blob);
				});
			}
		});

		//*** Add Writing
		addButton('ج', function() {
			
			practiceMatched = false;
			var chk = document.querySelector('input[id="ج"]');
			if(chk.checked){
				practiceMode = true;
				randomAlpha = Math.floor(Math.random() * alpha.length);
				//$(`button:contains('${playIcon}')`).show();
				$("#can-letters").val(alpha[randomAlpha]);
			}
			else{
				//$(`button:contains('${playIcon}')`).hide();
				$("#can-img").prop('src','');
				$("#can-img").hide();
				practiceMode = false;
			}
			display();
		}, 'checkbox');

		//*** Add Play
		addButton(playIcon, function() {			
			// draw Writing view
			var isPlay = $(`button:contains('${playIcon}')`).length > 0;
			if(isPlay == true){
				$(`button:contains('${playIcon}')`).html(stopIcon);
				var i = animLookup[$("#can-letters").val()];
				$("#can-img").prop('src', i ?? '');
				$("#can-img").show();
				$("#can").hide();
			}else{
				$("#can").show();
				$("#can-img").hide();
				$("#can-img").prop('src', '');
				$(`button:contains('${stopIcon}')`).html(playIcon);
				$("button:contains('Clear')").trigger('click');
			}
		});
	}
	
	function addButton(name, func, style){
		var btn = style == 'checkbox' ?
				document.createElement("input"):
				document.createElement("button");
		//if(name == playIcon){ btn.hidden=true; }
		btn.height = 16;
		btn.className = "btn";
		btn.innerHTML = name;
		btn.addEventListener('click', func);
		if(style == 'checkbox'){ 
			btn.type = "checkbox";
			btn.id = name;
		}
		colorSel.appendChild(btn);
		if(style == 'checkbox'){ 
			var txt = document.createTextNode(name);
			txt.style = 'verticalAlign:middle';
			colorSel.appendChild(txt);
		}
	}

	var updateDisplay = true; // when true the display needs updating
	var ch, cw, w, h; // global canvas size vars
	var currentLine;
	var displayOffset = {
	  x: 0,
	  y: 0
	};

	// a point object creates point from x,y coords or object that has x,y
	const point = (x, y = x.y + ((x = x.x) * 0)) => ({
	  x,
	  y
	});
	// function to add a point to the line
	function addPoint(x, y) {
	  this.points.push(point(x, y));
	}

	function drawLine(ctx, offset) { // draws a line
	  ctx.strokeStyle = this.color;
	  ctx.lineWidth = this.width;
	  ctx.lineJoin = "round";
	  ctx.lineCap = "round";
	  ctx.beginPath();
	  var i = 0;
	  while (i < this.points.length) {
		const p = this.points[i++];
		ctx.lineTo(p.x + offset.x, p.y + offset.y);
	  }
	  ctx.stroke();
	}

	function createLine(color, width) {
	  return {
		points: [],
		color,
		width,
		add: addPoint,
		draw: drawLine,
	  };
	}


	// creates a canvas
	function createCanvas(width, height) {
	  const c = document.createElement("canvas");
	  c.width = width;
	  c.height = height;
	  c.ctx = c.getContext("2d");
	  return c;
	}
	// resize main display canvas and set global size vars
	function resizeCanvas() {
	  ch = ((h = canvas.height = maxHeight - 16) / 2) | 0;
	  cw = ((w = canvas.width = innerWidth) / 2) | 0;
	  updateDisplay = true;
	}

	function createMouse() {
	  function preventDefault(e) { e.preventDefault() }
	  const mouse = {
		x: 0,
		y: 0,
		buttonRaw: 0,
		prevButton: 0
	  };
	  const bm = [1, 2, 4, 6, 5, 3]; // bit masks for mouse buttons
	  const mouseEvents = "mousemove,mousedown,mouseup,touchstart,touchmove".split(",");
	  const m = mouse;
	  
	  // one mouse handler
	  function mouseMove(e) {
	  	
		var pageX = e.pageX ?? (e.touches && e.touches.length > 0 ? e.touches[0].pageX : 0);
		var pageY = e.pageY ?? (e.touches && e.touches.length > 0 ? e.touches[0].pageY : 0);
		
		if(pageY < 32) 
			return;
		
		if(e.touches && e.touches.length > 0){
			if(e.type === "touchstart")
				m.buttonRaw = 1;
		}
		
		m.bounds = m.element.getBoundingClientRect();
		m.x = pageX- m.bounds.left - scrollX;
		m.y = pageY- m.bounds.top - scrollY;
		
		if (e.type === "mousedown" || e.type === "touchstart" ) {
		  m.buttonRaw |= bm[e.which - 1];
		} else if (e.type === "mouseup" || e.type === "touchend") {
		  m.buttonRaw &= bm[e.which + 2];
		}
		// check if there should be a display update
		if (m.buttonRaw || m.buttonRaw !== m.prevButton) {
		  updateDisplay = true;
		}
		// if the mouse is down and the prev mouse is up then start a new line
		if (m.buttonRaw !== 0 && m.prevButton === 0) { // starting new line
		  currentLine = createLine(currentColor, currentWidth);
		  currentLine.add(m); // add current mouse position
		} else if (m.buttonRaw !== 0 && m.prevButton !== 0) { // while mouse is down
		  if(currentLine)
			currentLine.add(m); // add current mouse position      
		}
		m.prevButton = m.buttonRaw; // remember the previous mouse state
		e.preventDefault();
	  }
	  
	  // starts the mouse 
	  m.start = function(element, blockContextMenu) {
		m.element = element;

		mouseEvents.forEach(n => document.addEventListener(n, mouseMove));
		document.addEventListener('touchend', function(){
			if(m)
				m.buttonRaw = 0;
		});
		if (blockContextMenu === true) {
		  document.addEventListener("contextmenu", preventDefault)
		}
		return m
	  }
	  return m;	
	}
	
	var cursor = "crosshair";
	function update(timer) { // Main update loop
	  cursor = "crosshair";
	  globalTime = timer;
	  // if the window size has changed resize the canvas
	  if (w !== innerWidth || h !== innerHeight) {
		resizeCanvas()
	  }
	  if (updateDisplay) {
		updateDisplay = false;
		display(); // call demo code
	  }
	 
	  ctx.canvas.style.cursor = cursor;
	  requestAnimationFrame(update);
	}
	
	// create a drawing canvas.
	const drawing = createCanvas(drawingInfo.width, drawingInfo.height);
	// fill with white
	drawing.ctx.fillStyle = drawingInfo.bgColor;
	drawing.ctx.fillRect(0, 0, drawing.width, drawing.height);

	// function to display drawing 
	function display() {

	  ctx.clearRect(0, 0, w, h);
	  ctx.fillStyle = "rgba(0,0,0,0.25)";
	  const imgX = cw - (drawing.width / 2) | 0;
	  const imgY = ch - (drawing.height / 2) | 0;
	  
	  // add a shadow to make it look nice
	  ctx.fillRect(imgX + 5, imgY + 5, drawing.width, drawing.height);

	  // add outline
	  ctx.strokeStyle = "black";
	  ctx.lineWidth = "2";
	  ctx.strokeRect(imgX, imgY, drawing.width, drawing.height);

	  // draw the image
	  ctx.drawImage(drawing, imgX, imgY);
	  if (mouse.buttonRaw !== 0) {
		if (currentLine !== undefined) {
		  currentLine.draw(ctx, displayOffset); // draw line on display canvas
		  cursor = "none";
		  updateDisplay = true; // keep updating 
		}
	  } else if (mouse.buttonRaw === 0) {
		if (currentLine !== undefined) {
		  currentLine.draw(drawing.ctx, {x: -imgX, y: -imgY }); // draw line on drawing
		  currentLine = undefined;
		  updateDisplay = true;
		  // next line is a quick fix to stop a slight flicker due to the current frame not showing the line
		  ctx.drawImage(drawing, imgX, imgY);
		}
	  }

	  //draw external image
	  var img = document.getElementById("can-img");
	  if(img.src !== '' ){
		if(img.width > canvas.width || img.height > canvas.height)
			if(img.width > canvas.width){
				var w = canvas.width;
				var h = img.height * (canvas.width/img.width)
				ctx.drawImage(img, imgX+20, imgY+20, w, h);
			}
			else{
				var h = canvas.height;
				var w = img.width * (canvas.height/img.height)
				ctx.drawImage(img, imgX+20, imgY+20, w, h);
			}
		else
			ctx.drawImage(img, imgX+20, imgY+20);
	  }	  

	  // draw Practice Alphabet
	  if(practiceMode){
	    ctx.font = '180px Noto Sans Arabic UI, sans-serif';
		ctx.strokeStyle = 'lightgray';
		ctx.lineWidth = 2;
		ctx.textAlign = 'center';
		ctx.textBaseline = 'middle';
		practiceAlpha = alpha[randomAlpha]; 
		ctx.strokeText(practiceAlpha, cw, ch);
		if(practiceMatched === true){
			ctx.fillStyle = 'green';
			ctx.fillText(practiceAlpha, cw, ch);
		}		
	  }
	}
	
	//************************************************************
	async function runOCR(url){
		var output = $("#ocrResult");
		Tesseract.recognize(
			url, 'ara'
		).then(result => {
			if(result.data){
				output.text(result.data.text.trim());
				output.append(`
				<br/><br/>
				<a style="font-size:14px;" href="#" onclick="copy()">[Copy text]</a>`);

				practiceMatched = practiceMode && 
					practiceAlpha == arRemovePunct(result.data.text.trim());
				
				if(practiceMatched)
				{
					alert('Well-done!');
				}
			}
			else
				output.text('Error!');
		}).catch(err => {
			output.html(`<p style="font-size:12px;">Error: ${err}</p>`);
			console.log(err);
		});
	}
		
	async function canvasToText(blob){
		var output = $("#ocrResult");
		try{
			const reader = new FileReader();
			reader.readAsDataURL(new Blob([blob], { type: 'image/png' })); 
			reader.onloadend = function() {
				runOCR(reader.result);
			}
		}
		catch(err){
			output.html(err);
		}
	}
	
	function saveCanvas(content){
		const blob = new Blob([content], { type: 'image/png' });

		// Create a link element
		const link = document.createElement('a');
		link.href = URL.createObjectURL(blob);
		link.download = 'image.png';

		// Append the link to the body (required for Firefox)
		document.body.appendChild(link);

		// Programmatically click the link to trigger the download
		link.click();

		// Remove the link from the document
		document.body.removeChild(link);
	}
	
	function copy(){ 
		var txt = $("#ocrResult").text()
								 .replace('\n[Copy text]', '');
		navigator.clipboard.writeText(txt);
	}
	
	function credit(){
		var w=parent?parent.window:window; 
		w.open("https://github.com/tesseract-ocr/tesseract","_blank");
	}
	</script>
</head>
	<body>
	  <div class="can-container">
		  <canvas id="can"></canvas>
		  <div class="colors" id="colorSel"></div>
		  <select id="can-letters" style="float: right;"></select>
		  <img id="can-img" style="width:100%;margin:0;"></img>
	  </div>
	  <div id="ocrResult"> </div>
	  <div style="position:absolute;display:block;font-size:10px;bottom:150px;margin:auto;">
		Powered by: <a href="#" onclick="credit()">https://github.com/tesseract-ocr/tesseract</a>
	  </div>
	</body>
