<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
	<link rel="stylesheet" type="text/css" href="styles/chart-styles.css" media="screen">
	<title>Arabic Vocabulary Charts</title>
	<script src="scripts/jquery/jquery-3.7.1.min.js"></script>
	<script src='https://unpkg.com/tesseract.js@7.0.0/dist/tesseract.min.js'></script>
	<script src="scripts/data-util.js"></script>
	<script>
		window.onload = function(){
			
			var folder = decodeURI(getParamValue("folder"));
			if(!folder || folder === "undefined"){ 
				folder = decodeURI(getParamValue("data"));
			}
			if(folder){
				// Set Chart title
				$("#chartTitle").html(folder);

				var url = getLocationPath() + 'images/charts/'+folder+'/';
				loadCharts(url, getMax(folder), true);
				if(folder === "alphabets" || 
				   folder === "homonym"   || 
				   folder === "antonym"){
					addImagePreviewer("chartContainer", 'bottom');
				}else if(folder === "imperative"){
					addImagePreviewer("chartContainer", '');
				}else 
				{
					addImagePreviewer("chartContainer", 'bottom-top');
				}
			}
		}	
		
		function getMax(folder){
			var max = 10;
			switch (folder){
				case "alphabets": max = 28; break;
				case "antonym": max = 30; break;
				case "homonym": max=32; break;
				case "jarr": max=16; break;
				case "synonym": max=12; break;
				case "verbs": max=28; break;
				case "verb-forms": max=32; break;
				case "imperative": max=32; break;
			}
			return max;
		}
		
		function loadCharts(url, maxFiles){
		
			var firstLoad = parent && parent.dataCache["charts-data-first"];
		    var indices = Array.from({length: maxFiles}, (_, i) => i);
			if(firstLoad || !url.endsWith('/alphabets/')){
				indices = getRandomIndices(indices);
			}
			if(parent)
				parent.dataCache["charts-data-first"] = true;

			var div = '<div class="chart">';
			for(var i=0; i < maxFiles; i++){
				var imgUrl = url+(indices[i]+1)+'.png';
				div += `<img class="chartTile" src="${imgUrl}"
							onclick="parseImageAndPlay('${imgUrl}')">
						</img>`;
			}
            div += '</div>';
			$("#chartContainer").empty();
			$("#chartContainer").append($(div));
		}
		
		function parseImageAndPlay(url){
			var isAlphabet = url.includes('alphabets') || 
							 url.includes('homonym') ||
							 url.includes('synonym') || 
							 url.includes('antonym') || 
							 url.includes('jarr');
			tesseract_imageToText(url, 'ara', function(success, data){
				if(success === true){
					if(isAlphabet){
						var t = data.split('\n').filter(x => x != "");
						if(t.length > 0){
							data = t[t.length-1];
						}
					}
					data = data.replace(/[©\+\>\<\|\-0-9\.a-zA-Z\"\']+/g, '');
					if(isAlphabet)
						data = data.replace(/\s+/g, '.');
					playCard(data)
				}
			});
		}
	</script>
</head>
  <body>
	<script src="scripts/require.js"></script>
	<span style="text-align: middle; align-content: center;">
		<a href="#" style="text-decoration: none;"
			onclick="convertHTMLtoImage('#chartContainer',[],'exported-charts.pdf');">
			<img src="images/exp.png" 
				style="width: 16px; height: 16px;"
				alt="Export to PDF"/>
		</a>
		<a style="position:relative;top:-12px;font-weight:bolder;
		          float:right;font-size:22px;text-decoration:none;margin-right: 20px;" 
				  href="#" onclick="iterateList(parent.$('#selChart'), true)">&rarr;</a>
		<a id="chartTitle" style="position:relative;top:-4px;font-weight:bolder;
		          float:right;font-size:12px;text-decoration:none;" 
				  href="#" onclick="">chart</a>
		<a style="position:relative;top:-12px;font-weight:bolder;
		          float:right;font-size:22px;text-decoration:none;" 
				  href="#" onclick="iterateList(parent.$('#selChart'))">&larr;</a>
	</span>
	<div class="image-preview" style="display: none;align-items: center;justify-content: center;"></div>
    <div id="chartContainer">
  </div>
</body>
</html>
