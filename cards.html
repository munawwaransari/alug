<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
	<link rel="stylesheet" type="text/css" href="styles/card-styles.css" media="screen">
	<title>Arabic Vocabulary Cards</title>
	<script src="scripts/jquery/jquery-3.7.1.min.js"></script>
	<script src="scripts/require.js"></script>
	<script src="scripts/data-util.js"></script>
	<script>
		var cardImagesRequests = {};
		if(parent.dataCache["CardImages"] === undefined)
			parent.dataCache["CardImages"] = {};
		ensureDataLoaded({name: "ai-prompts"});
		window.onload = () => {
			// Register observer handler
			parent.dataCache["imgObserver"].interSectionHandlers["cards"] = handleIntersection;
			createImageObserver();
			addImagePreviewer("cardContainer", 'bottom');
			reloadCardData();
		}

		window.beforeunload = () => {
			Object.keys(cardImagesRequests).forEach((key) => {
				var img = $(`img[inumber='${key}']`);
				parent.dataCache["imgObserver"].observer.unobserve(img[0]);
			});
		}
		
		function handleIntersection(entry, observer) {
			// Check if this specific image is visible in the viewport
			if (entry.isIntersecting) {
				const img = $(entry.target);
				const inumber = img.attr('inumber');
				const req = inumber ? cardImagesRequests[inumber] : undefined;
				if(req !== undefined && img.prop('src')?.length === 0){
					genFreeImage(`img[inumber='${req.inumber}']`,
						req.key,
						req.category
					).then((imgSrc)=> {
						delete cardImagesRequests[req.inumber];
						parent.dataCache["CardImages"][req.inumber] = imgSrc;
						parent.dataCache["imgObserver"].observer.unobserve(img[0]);
						img.removeAttr('is-observed');
						img.prop('src',imgSrc);
					});	
				}
			}
		}

		function addImageToObserver(req){
			var img = $(`img[inumber='${req.inumber}']`);
			if(img.length > 0){
				if(	parent.dataCache["CardImages"][req.inumber] !== undefined){
					img.prop('src', parent.dataCache["CardImages"][req.inumber]);
				}
				else if(!img.attr('is-observed')){
					cardImagesRequests[req.inumber] = req;
					parent.dataCache["imgObserver"].observer.observe(img[0]);
					img.attr('is-observed', 'true');
				}
			}
		}

		function reloadCardData(){
			var dataParam = decodeURI(getParamValue("data"));
			if(dataParam && dataParam != 'undefined'){
				var url = getLocationPath() + 'data/grmr/'+dataParam+'.json';
				loadJsonData(url).then((data) => {
					const firstKey = Object.keys(data)[0];
					var div = $("#cardContainer");
					div.empty();
					var firstLoad = parent && parent.dataCache["cards-data-first"];
					var rdata = [];
					if(dataParam == "alpha" && firstLoad == undefined){
						rdata = Array.from({length: data[firstKey].length}, (_, i) => i);
					}else {
						rdata = getRandomIndices(data[firstKey]); 
					}
					if(parent)
						parent.dataCache["cards-data-first"] = true;

					rdata.forEach(function(index){
						var cdata = data[firstKey][index];
						drawCard(div, dataParam, cdata, index);
					});
				});
			}
		}

		function drawCard(div, name, cdata, index){
		
		  switch(name){
			case "alpha":
				drawAlphabet(div, cdata, index, name);
				break;
			case 'actions':
			case 'genres':
			case "synonym":
				drawSynonym(div, cdata, index, name);
				break;
			case 'countries':
			case 'media':
			case "antonym":
				drawAntonyms(div, cdata, index, name);
				break;
			case "homonym":
				drawHomonymn(div, cdata, index, name);
				break;
			case "hyperbole":
				drawHyperbole(div, cdata, index);
				break;
			case "tajweed":
				drawTajweed(div, cdata, index);
				break;
			case "greetings":
				drawGreetings(div, cdata, index);
				break;
			case "colors":
				drawColors(div, cdata, index);
				break;
			case "pronouns":
				drawPronouns(div, cdata, index);
				break;
		  }		
		}

		function drawAlphabet(div, alpha, index, name) {
		  var iNameArr = alpha.imageName.split("|");
		  var iIndex = getRandomIndices(iNameArr);
		  var iName = iNameArr[iIndex[0]];
		  var eNameArr = alpha.enName.split("|");
		  var eName = eNameArr[iIndex[0]];

		  var wType = alpha.type === "C" ? "حَرف الصَّحِيحَة" : alpha.number !== 1 ? "حَرف العِلَّة": "";
		  var cls = alpha.type === "C" ? "consonant" : "vowel";
		  var tooltip = alpha.name+"\n"+cls+"\n"+alpha.class+"\nnumber:"+alpha.number;
		  
		  var adiv = `
		  	<div title="${tooltip}" class="alpha-box ${alpha.class} ${cls}">
				<p class="top-left ${alpha.class} ${cls}">${alpha.en}</p>
				<p style="margin-top:40px;" class="${alpha.class} ${cls}">${alpha.char}</p><br/>
				<p class="alpha-name ${alpha.class} ${cls}">(${alpha.name})<br/><sub>${wType}</sub></p>
			</div>`;
		             
		    var fdiv = `
			<div class="flip-card" number=${alpha.number}>
                <div class="flip-card-inner">
                	<div class="flip-card-front">${adiv}</div>
                    <div class="flip-card-back">
                        <img ontouchstart="playCard('${iName}')"
							 onmouseenter="playCard('${iName}')" 
                             style="top:12%; height:80%" 
							 class="alpha-image" 
							 loading="lazy"
							 inumber="${name}-${alpha.number}-${iIndex[0]}"
							 title="${iName}">
                        </img>
                        <span style="margin-bottom:0">
						<a href="#" style="text-decoration:none;cursor:pointer;color:#E6E6FA;"
							onclick="openGoogleAISearch(
								getPromptFromKey(['Alphabets'], 
									{'0': ['${iName}']}, true));">
							${iName}
						</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
			if(alpha.number !== 1){
				addImageToObserver({
					inumber: `${name}-${alpha.number}-${iIndex[0]}`,
					key: eName ?? iName,
					category:  ''
				});
			}else{
				var img = $(`img[inumber='alpha-${alpha.number}-${iIndex[0]}'`);
				if(img.length > 0){
					img.prop('src', 'images/alif.png');
					img.css('cursor', 'pointer');
					img.on('click', function(){
						parent.redirect('dict.html', 'cmp', 'pos:0');
					});
				}
			}
		} 
		
		function drawHomonymn(div, h, index, name) {
			if (h.en.length > 1) {
				var fdiv = `
				<div class="flip-card" number=${index}>
					<div class="flip-card-inner">
						<div class="flip-card-front">
							<img style="top:24%; width:94%; height:76%" 
									title="${h.names[0]}"
									class="alpha-image"
									inumber="${name}-${index}"> 
							</img>
							<span style="top:10px; margin-bottom:0; font-size:18px">
								<a href="#" style="text-decoration:none; cursor:pointer;"
									onclick="openGoogleAISearch(
										getPromptFromKey(['Homonyms'], 
											{'0': ['${h.names[0]}<br/>${h.ur[0]}/${h.en[0]}']}, true));">
								${h.names[0]}<br/>${h.ur[0]}/${h.en[0]}
								</a>
							</span>
						</div>
						<div class="flip-card-back">
							<img ontouchstart="playCard('${h.names[0]}','${h.en[0]}')"
									onmouseout="playCard('${h.names[0]}','${h.en[0]}')"
									onmouseenter="playCard('${h.names[1]}', '${h.en[1]}')" 
									style="top:24%; width:94%; height:76%" 
									title="${h.names[1]}"
									loading="lazy"
									class="alpha-image"
									inumber="${name}-${index}b" >
							</img>
							<span style="top:10px; margin-bottom:0; font-size:18px">
								<a href="#" style="text-decoration:none; cursor:pointer;color:#E6E6FA;"
									onclick="openGoogleAISearch(
										getPromptFromKey(['Homonyms'], 
											{'0': ['${h.names[1]}<br/>${h.ur[1]}/${h.en[1]}']}, true));">
								${h.names[1]}<br/>${h.ur[1]}/${h.en[1]}
								</a>
							</span>
						</div>
					</div>
				</div>`;
				div.append($(fdiv));
			} else {
				div.append($(adiv));
			}

			addImageToObserver({
				inumber: `${name}-${index}`, key: h.en[0],category: h.category
			});
			addImageToObserver({
				inumber: `${name}-${index}b`, key: h.en[1],category: h.category
			});
		} 
		
		function drawAntonyms(div, h, index, name){             
			var fdiv = `
			<div class="flip-card" number=${index}>
                <div class="flip-card-inner">
                	<div class="flip-card-front">
						<img style="top:24%; width:94%; height:76%" 
							title="${h.names[0]}" 
							class="alpha-image"
							inumber="${name}-${index}">
                        </img>
						<span style="top:10px; margin-bottom:0; font-size:18px">
						<a href="#" style="text-decoration:none; cursor:pointer;"
							onclick="openGoogleAISearch(
								getPromptFromKey(['Antonyms'], 
									{'0': ['${h.names[0]},${h.ur[0]}/${h.en[0]}']}, true));">
						${h.names[0]}<br/>${h.ur[0] !== '' ? `${h.ur[0]}/`:''}${h.en[0]}
						</a>
						</span>
                    </div>
                    <div class="flip-card-back">
                        <img ontouchstart="playCard('${h.names[0]}', '${h.en[0]}')"
							onmouseout="playCard('${h.names[0]}', '${h.en[0]}')"
							onmouseenter="playCard('${h.names[1]}', '${h.en[1]}')"
                            style="top:24%; width:94%; height:76%" 
							title="${h.names[1]}"
							loading="lazy"
							class="alpha-image" 
							inumber="${name}-${index}b">
                        </img>
						<span style="top:10px; margin-bottom:0; font-size:18px">
						<a href="#" style="text-decoration:none; cursor:pointer;color:#E6E6FA;"
							onclick="openGoogleAISearch(
								getPromptFromKey(['Antonyms'], 
									{'0': ['${h.names[1]}<br/>${h.ur[1]}/${h.en[1]}']}, true));">
							${h.names[1]}<br/>${h.ur[1] !== '' ? `${h.ur[1]}/`:''}${h.en[1]}
						</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
			
			addImageToObserver({
				inumber: `${name}-${index}`, key: h.en[0]=='Zionism'?'Israel':h.en[0],category: h.category
			});
			addImageToObserver({
				inumber: `${name}-${index}b`, key: h.en[1],category: h.category
			});
		} 
		
		function drawSynonym(div, syn, index, name) {

			if(syn.ar === undefined || syn.ar === 'undefined'){
				syn.ar = syn.names[0] ?? '';
			}
			var adiv = `
		  	<div class="alpha-box" style="align-content: center;">
				<div class="center">${syn.en}<br/>
					<p style="font-size: 20px;">${syn.ur}</p>
				</div>
				<div class="top-left">${syn.names[0] ?? ''}</div>
				<div class="top-right">${syn.names[1] ?? ''}</div>
				<div class="bottom-left">${syn.names[2] ?? ''}</div>
				<div class="bottom-right">${syn.names[3] ?? ''}</div>
			</div>`;

			var fdiv = `
			<div class="flip-card">
				<div class="flip-card-inner">
					<div class="flip-card-front">${adiv}</div>
					<div class="flip-card-back" number=${index}>
						<img ontouchstart="playCard('${syn.ar}', '${syn.en}')"
							onmouseenter="if('${syn.ar}') playCard('${syn.ar}', '${syn.en}')"
							style="top:18%; width:96%; height:80%" 
							title="${syn.ar}"
							loading="lazy"
							class="alpha-image"
							inumber="${name}-${index}">
						</img>
						<span style="top:10px; margin-bottom:0">
							<a href="#" style="text-decoration:none; cursor:pointer;color:#E6E6FA;"
								onclick="openGoogleAISearch(
								getPromptFromKey(['Synonyms'], 
									{'0': ['${syn.en}<br/>${syn.ur}', 
										['${syn.names[0]  ?? ''}',
											'${syn.names[1]  ?? ''}',
											'${syn.names[2]  ?? ''}',
											'${syn.names[3]}  ?? ''']]}, true));">
								${syn.en}<br/>${syn.ur}
							</a>
						</span>
					</div>
				</div>
			</div>`;
			div.append($(fdiv));
			
			addImageToObserver({
				inumber: `${name}-${index}`, key: syn.en, category: syn.category
			});
		}

		function drawHyperbole(div, h){             
		    var fdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
                <div class="flip-card-inner">
                    <div class="flip-card-front" 
						 style="position:relative;display:inline-grid;margin:auto;align-items:center;font-size:34px"
						 onmouseenter="playCard('${h.names[0]}')">
					${h.names[0]}<br/><span style="font-size:20px;">${h.en[0]}</span>
                    </div>
                    <div class="flip-card-back">
						<span style="position:relative; display:flex; align-items:center; font-size:32px;">
							<a href="#" style="text-decoration:none; cursor:pointer;color:#E6E6FA;"
								onclick="openGoogleAISearch(
								getPromptFromKey(['Hyperboles'], 
									{'0': ['${h.names[0]}<br/>${h.en[0]}']}, true));">
								${h.names[1]}
							</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
		}
		
		function drawTajweed(div, h){             
		    var prompt = getPromptFromKey(['Tajweed'], {'0': [h.en]}, true);
			var onclick = `openGoogleAISearch(\`${prompt}\`, true);"`;
			var fdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
                <div class="flip-card-inner">
                    <div class="flip-card-front" onmouseenter="playCard('${h.play}')">
					    <span style="position:relative; display:flex; align-items:center; font-size:28px">
							${h.en[0]}
						</span>
                    </div>
                    <div class="flip-card-back">
						<span style="position:relative; display:flex; align-items:center; font-size:30px">
							<a href="#" style="text-decoration:none; cursor:pointer;color:#E6E6FA;"
							 onclick="${onclick}">
								${h.names.map((n, i) => `${n}<br/><br/>`).join("")}
							</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
		}
		
		function drawGreetings(div, h){             

			h.names.every(function(name, i){			
				var fdiv = `
				<div class="flip-card" style="border:4px solid transparent;">
					<div class="flip-card-inner">
						<div class="flip-card-front"
							 ontouchstart="playCard('${name}')" 
							 onmouseenter="playCard('${name}')">
							<span style="position:relative; display:flex; align-items:center; font-size:34px">
								${name}
							</span>
						</div>
						<div class="flip-card-back">
							<span style="position:relative; display:flex; align-items:center; font-size:32px">
							<a href="#" style="text-decoration:none; cursor:pointer;color:#E6E6FA;"
								onclick="openGoogleAISearch(
								getPromptFromKey(['Greetings'], 
									{'0': ['${name}', '${h.en[i]}']}, true));">
								${h.en[i]}
							</a>
							</span>
						</div>
					</div>
				</div>`;
				div.append($(fdiv));
				return true;
			});
		}	
		
		function drawColors(div, color){		
		  	var tooltip = color.en;		  		             
			var backColor = `color:${color.color === '#708090' ? '#FFFFFF' : invertColor(color.color)}`;
			var backStyle = 'style="background-color:'+color.color+';"';
			var content = `
			<p style="font-size:38px;margin:auto;align-content:middle;:50px;${backColor}">
				XYZ
				<br/><span style="font-size:28px;${backColor}">${color.en}</span>
				<br/><span style="font-size:32px;${backColor}"><sub>${color.ur}</sub></span>
				<br/><span style="font-size:18px;${backColor};">(${color.color.replace("#",'')})</span>
			</p>`;
							
			var cdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
				<div class="flip-card-inner">
					<div class="flip-card-front"
							ontouchstart="playCard('${color.names[0]}.${color.names[1]}')"
							onmouseenter="playCard('${color.names[0]}.${color.names[1]}')"
							${backStyle}>
						${content.replace('XYZ', color.names[0])}
					</div>
					<div class="flip-card-back" ${backStyle}>
						${content.replace('XYZ', color.names[1])}
					</div>
				</div>
			</div>`;
			div.append($(cdiv));
		} 
		
		function drawPronouns(div, p){             
		
			var fdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
				<div class="flip-card-inner">
					<div class="flip-card-front">
						<span style="position:relative; display:flex; align-items:center; font-size:34px">
							${p.names[0]}<br/>${p.en[0]}<br/>${p.type ? `</sub>${p.type}</sub>`: ''}
						</span>
					</div>
					<div class="flip-card-back"
						 ontouchstart="playCard('${p.names[0]}.${p.names[1]}')"
						 onmouseenter="playCard('${p.names[0]}.${p.names[1]}')" >
						<span style="position:relative; display:flex; align-items:center; font-size:32px">
							${p.names[1]}<br/>${p.en[1]}<br/>${p.type ? `</sub>${p.type}</sub>`: ''}
						</span>
					</div>
				</div>
			</div>`;
		div.append($(fdiv));
	}	

	function toggleIcon(el){
		var img = $(el).find('img');
		if(img.prop('src').indexOf('menu-disabled') > -1){
			img.prop('src', 'images/menu-enabled.jpg');
			return 1;
		}else{
			img.prop('src', 'images/menu-disabled.jpg');
			return 0;
		}
	}
	function toggleCardImages(el){
		toggleIcon(el);
		$("#cardContainer .flip-card-front").toggleClass('flip-card-front flip-card-f');
		$("#cardContainer .flip-card-back").toggleClass('flip-card-back flip-card-front');
		$("#cardContainer .flip-card-f").toggleClass('flip-card-f flip-card-back');		
	}

	var playCardTimer = undefined;
	function stopPlayCards(elem){
			$(elem).html('▶');
			if(playCardTimer !== undefined)
				clearInterval(playCardTimer);
			playCardTimer = undefined;
			reloadCardData();
	}

	function playAllCards(elem){
		
		var state = $(elem).html().trim();
		if(state == '⏹'){ // stop
			stopPlayCards(elem);
			return;
		}

		$(elem).html('⏹'); //stop
		var cards = $(".flip-card").sort((a,b) => $(a).attr('number') >= $(b).attr('number'));
		
		var index = -1;
		playCardTimer = setInterval(() => {
			if(index < cards.length){				
				index++;

				var text = '';
				if( $(".bottom-right").length > 0 ){
					text = `${$(cards[index]).find(".top-right").html()} . ${$(cards[index]).find(".top-left").html()} . ${$(cards[index]).find(".bottom-right").html()} . ${$(cards[index]).find(".bottom-left").html()}`;
				}else{
					var textElem = $(cards[index]).find('span:last');
					if(textElem.find("a").length > 0){
						textElem = textElem.find("a");
					}
					text = textElem.html();
					if(text) {
						text = text.trim()
						if(text.includes("<br>")){
							text = text.split("<br>")[0];
						}
					}
				}

				if(text == undefined || text == "undefined" || text == ""){
					return;
				}
				var bc = $(cards[index]).find(".flip-card-inner");
				var oldT = $(bc).css('transform');
				$(bc).css('transform', 'rotateY(180deg)');
				playCard(text);
				setTimeout(function(){
					$(bc).css('transform', oldT);
				}, 1500);
			}else{
				$(elem).html('▶');
				clearInterval(playCardTimer);
				playCardTimer = undefined;
				reloadCardData();
			}
		}, 2500, index);
	}
	</script>
</head>
  <body>
	<span style="text-align: middle; align-content: center;">
		<a href="#" style="text-decoration: none;" 
			title="Export to PDF"
			onclick="convertHTMLtoImage('#cardContainer', 
								        ['#cardContainer .flip-card-front',
									     '#cardContainer .flip-card-back'], 
										'exported-cards.pdf');">
			<img src="images/exp.png" style="width: 16px; height: 16px;"/>
		</a>
		<a href="#" style="text-decoration: none;" title="Toggle Images" 
			onclick=" toggleCardImages(this)">
			<img src="images/menu-disabled.jpg" style="width: 20px; height: 16px;" />
		</a>
		<a href="#" style="position:relative; top: -4px; left:4px; width: 20px; height: 16px;text-decoration: none;" 
			title="Play Cards"
			onclick="playAllCards(this)">▶</a>

		<a href="https://pixabay.com/" target="_blank"
			style="float:right;margin:0;padding:0;font-size:10px;line-height:1.7;color:#555;display:block;">
        	Free images by Pixabay
        </a>
		
	</span>
	<div class="image-preview" style="display: none;align-items: center;justify-content: center;"></div>
	<div id="cardContainer"></div>
</body>
</html>
