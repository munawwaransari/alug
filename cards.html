<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" />
	<title>Arabic Vocabulary Cards</title>
	<script src="scripts/jquery/jquery-3.7.1.min.js"></script>
	<script src="scripts/require.js"></script>
	<script src="scripts/data-util.js"></script>
	<style>
	/*
	https://www.w3schools.com/howto/tryit.asp?filename=tryhow_css_flip_card
	*/
	.flip-card {
      background-color: transparent;
      perspective: 1000px;
	  width: 180px;
      height: 240px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
    }

    .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      justify-content: center;
      display: flex;
    }

    .flip-card-front {
      background-color: #bbb;
      color: black;
    }

    .flip-card-back {
      background-color: #2980b9;
      color: white;
      transform: rotateY(180deg);
      text-align: center;
      bottom: 0;
      display: flex;
    }

    /*
    Styles
    */
	 #cardContainer {
        display: inline-flex;
        flex-direction:row;
        flex-wrap: wrap;
        direction: rtl;
      }
    
      .alpha-box {
        position: relative;
        display: inline-block;
        /*float: left;*/
        text-align: center;
        border: 4px solid;
        transition: transform 0.6s;
        transform-style: preserve-3d;
        box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
		margin: 16px;;
		width: 236px;
		background-color:#255761;
      }
	  
      .alpha-box p {
        font-size: 48px;
        margin: auto;
      }
      
      .alpha-image {
        position: absolute;
        max-width: 180px;
        max-height: 260px;
        vertical-align: middle;
      }
	  
	  .alpha-box .center {
        text-align: center;
        padding: 10px;
		top: 36%;
		color: white;
      }
      
      .alpha-box .top-left {
		position:absolute;
        font-size: 22px;
        text-align: left;
        padding: 10px;
		left:0;
		top:0;
		color: white;
      }
      
	  .alpha-box .top-right {
		position:absolute;
        font-size: 22px;
        text-align: left;
        padding: 10px;
		right:0;
		top:0;
		color: white;
      }
	  
      .alpha-box .bottom-right {
        position:absolute;
		font-size: 22px;
        text-align: right;
		padding: 10px;
		bottom: 0;
		right:0;
		color: white;
      }
	  
	  .alpha-box .bottom-left {
        position:absolute;
		font-size: 22px;
        text-align: right;
		padding: 10px;
		bottom: 0;
		left:0;
		color: white;
      }
      
      .alpha-name {
        font-size: 20px!important;
        vertical-align: bottom;
      }
      .solar {
        background-color: #FFCF63;
      }
      
      .lunar {
          background-color: #4e5442;
      }
      
      .consonant {
        color: white;
      }
      
      .vowel {
        color: #D2691E;
      }

	  .image-preview {
		display: block;           /* Enables flexbox */
		justify-content: center;  /* Centers horizontally */
		align-items: center;      /* Centers vertically */
		z-index: 1;
		border: 4px solid blueviolet;
		background-color: aliceblue;
		width: 96%;
		margin-left: 1%;
		position: absolute;
	  }
	  .image-preview .image-prev:hover, .image-preview .image-next:hover {
	  		color: white;
			font-weight: bolder;
			
	  }
	</style>
	<script>
		var cardsFirstLoad = true;
		window.onload = () => {
			addImagePreviewer("cardContainer", 'bottom');
			reloadCardData();
		}
		ensureJsonData({name: "ai-prompts"});

		function reloadCardData(){
			var dataParam = decodeURI(getParamValue("data"));
			if(dataParam && dataParam != 'undefined'){
				var url = getLocationPath() + 'data/grmr/'+dataParam+'.json';
				loadJsonData(url).then((data) => {
					const firstKey = Object.keys(data)[0];
					var div = $("#cardContainer");
					div.empty();
					var firstLoad = parent && parent.dataCache["cards-data-first"];
					var rdata = [];
					if(dataParam == "alpha" && firstLoad == undefined){
						rdata = Array.from({length: data[firstKey].length}, (_, i) => i);
					}else {
						rdata = getRandomIndices(data[firstKey]); 
					}
					if(parent)
						parent.dataCache["cards-data-first"] = true;
					rdata.forEach(function(index){
						var cdata = data[firstKey][index];
							darwCard(div, dataParam, cdata);
					});
				});
			}
		}

		function darwCard(div, name, cdata){
		
		  switch(name){
			case "alpha":
				darwAlphabet(div, cdata);
				break;
			case 'genres':
			case "synonym":
				darwSynonym(div, cdata);
				break;
			case "antonym":
				darwAntonyms(div, cdata);
				break;
			case "homonym":
				darwHomonymn(div, cdata);
				break;
			case "hyperbole":
				darwHyperbole(div, cdata);
				break;
			case "tajweed":
				darwTajweed(div, cdata);
				break;
			case "greetings":
				darwGreetings(div, cdata);
				break;
			case "colors":
				drawColors(div, cdata);
				break;
			case "pronouns":
				drawPronouns(div, cdata);
				break;
		  }
		} 
		
		function darwAlphabet(div, alpha){
		
		  var cls = alpha.type === "C" ? "consonant" : "vowel";
		  var tooltip = alpha.name+"\n"+cls+"\n"+alpha.class+"\nnumber:"+alpha.number;
		  
		  var adiv = `
		  	<div title="${tooltip}" class="alpha-box ${alpha.class}">
				<p class="top-left">${alpha.en}</p>
				<p style="margin-top:40px;" class="${cls}">${alpha.char}</p><br/>
				<p class="alpha-name ${cls}">(${alpha.name})</p>
			</div>`;
		             
		    var fdiv = `
			<div class="flip-card" number=${alpha.number}>
                <div class="flip-card-inner">
                	<div class="flip-card-front">${adiv}</div>
                    <div class="flip-card-back">
                        <img ontouchstart="playCard('${alpha.imageName}')"
							 onmouseenter="playCard('${alpha.imageName}')" 
                             style="top:12%; height:80%" 
							 class="alpha-image" 
							 title="${alpha.imageName}"
							 src="${getFreeImageSource(alpha.enName ?? alpha.imageName)}">
                        </img>
                        <span style="margin-bottom:0">
						<a href="#" style="text-decoration:none; cursor:pointer;"
							onclick="openGoogleAISearch(
								getPromptFromKey(['Alphabets'], 
									{'0': ['${alpha.imageName[0]}']}, true));">
							${alpha.imageName.trim()}
						</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
		} 
		
		function darwHomonymn(div, h){             
		  if(h.images){
		    var fdiv = `
			<div class="flip-card">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
						<img style="top:24%; width:94%; height:76%" 
							 title="${h.names[0]}"
							 class="alpha-image" 
							 src="${getFreeImageSource(h.en[0])}">
                        </img>
						<span style="top:10px; margin-bottom:0; font-size:18px">
							<a href="#" style="text-decoration:none; cursor:pointer;"
								onclick="openGoogleAISearch(
									getPromptFromKey(['Homonyms'], 
										{'0': ['${h.names[0]}<br/>${h.ur[0]}/${h.en[0]}']}, true));">
							${h.names[0]}<br/>${h.ur[0]}/${h.en[0]}
							</a>
						</span>
                    </div>
                    <div class="flip-card-back">
                        <img ontouchstart="playCard('${h.names[0]}','${h.en[0]}')"
							 onmouseout="playCard('${h.names[0]}','${h.en[0]}')"
							 onmouseenter="playCard('${h.names[1]}', '${h.en[1]}')" 
                             style="top:24%; width:94%; height:76%" 
							 title="${h.names[1]}"
							 class="alpha-image" 
							 src="${getFreeImageSource(h.en[1])}">
                        </img>
						<span style="top:10px; margin-bottom:0; font-size:18px">
							<a href="#" style="text-decoration:none; cursor:pointer;"
								onclick="openGoogleAISearch(
									getPromptFromKey(['Homonyms'], 
										{'0': ['${h.names[1]}<br/>${h.ur[1]}/${h.en[1]}']}, true));">
							${h.names[1]}<br/>${h.ur[1]}/${h.en[1]}
							</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
		  }else{
		   div.append($(adiv));
		  }
		} 
		
		function darwAntonyms(div, h){             
			var fdiv = `
			<div class="flip-card">
                <div class="flip-card-inner">
                	<div class="flip-card-front">
						<img style="top:24%; width:94%; height:76%" 
							title="${h.names[0]}"
							class="alpha-image" 
							src="${getFreeImageSource(h.en[0])}">
                        </img>
						<span style="top:10px; margin-bottom:0; font-size:18px">
						<a href="#" style="text-decoration:none; cursor:pointer;"
							onclick="openGoogleAISearch(
								getPromptFromKey(['Antonyms'], 
									{'0': ['${h.names[0]},${h.ur[0]}/${h.en[0]}']}, true));">
						${h.names[0]}<br/>${h.ur[0]}/${h.en[0]}
						</a>
						</span>
                    </div>
                    <div class="flip-card-back">
                        <img ontouchstart="playCard('${h.names[0]}', '${h.en[0]}')"
							onmouseout="playCard('${h.names[0]}', '${h.en[0]}')"
							onmouseenter="playCard('${h.names[1]}', '${h.en[1]}')"
                            style="top:24%; width:94%; height:76%" 
							title="${h.names[1]}"
							class="alpha-image" 
							src="${getFreeImageSource(h.en[1])}">
                        </img>
						<span style="top:10px; margin-bottom:0; font-size:18px">
						<a href="#" style="text-decoration:none; cursor:pointer;"
							onclick="openGoogleAISearch(
								getPromptFromKey(['Antonyms'], 
									{'0': ['${h.names[1]}<br/>${h.ur[1]}/${h.en[1]}']}, true));">
							${h.names[1]}<br/>${h.ur[1]}/${h.en[1]}
						</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
		} 
		
		function darwSynonym(div, syn) {

			var adiv = `
		  	<div class="alpha-box" style="align-content: center;">
				<div class="center">${syn.en}<br/>
					<p style="font-size: 20px;">${syn.ur}</p>
				</div>
				<div class="top-left">${syn.names[0]}</div>
				<div class="top-right">${syn.names[1]}</div>
				<div class="bottom-left">${syn.names[2]}</div>
				<div class="bottom-right">${syn.names[3]}</div>
			</div>`;

			var fdiv = `
			<div class="flip-card">
				<div class="flip-card-inner">
					<div class="flip-card-front">${adiv}</div>
					<div class="flip-card-back">
						<img ontouchstart="playCard('${syn.ar}', '${syn.en}')"
							onmouseenter="playCard('${syn.ar}', '${syn.en}')"
							style="top:18%; width:96%; height:80%" 
							title="${syn.ar}"
							class="alpha-image" 
							src="${getFreeImageSource(syn.en)}">
						</img>
						<span style="top:10px; margin-bottom:0">
							<a href="#" style="text-decoration:none; cursor:pointer;"
								onclick="openGoogleAISearch(
								getPromptFromKey(['Synonyms'], 
									{'0': ['${syn.en}<br/>${syn.ur}', 
										['${syn.names[0]}',
											'${syn.names[1]}',
											'${syn.names[2]}',
											'${syn.names[3]}']]}, true));">
								${syn.en}<br/>${syn.ur}
							</a>
						</span>
					</div>
				</div>
			</div>`;
			div.append($(fdiv));
		}

		function darwHyperbole(div, h){             
		    var fdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
                <div class="flip-card-inner">
                    <div class="flip-card-front" onmouseenter="playCard('${h.names[0]}')">
					    <span style="position:relative; display:flex; align-items:center; font-size:34px">
							${h.names[0]}<br/>${h.en[0]}
						</span>
                    </div>
                    <div class="flip-card-back">
                        <img style="opacity:0;top:24%; width:94%; height:76%" 
							 class="alpha-image" src="">
                        </img>
						<span style="position:relative; display:flex; align-items:center; font-size:32px">
							<a href="#" style="text-decoration:none; cursor:pointer;"
								onclick="openGoogleAISearch(
								getPromptFromKey(['Hyperboles'], 
									{'0': ['${h.names[0]}<br/>${h.en[0]}']}, true));">
								${h.names[1]}
							</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
		}
		
		function darwTajweed(div, h){             
		    var prompt = getPromptFromKey(['Tajweed'], {'0': [h.en]}, true);
			var onclick = `openGoogleAISearch(\`${prompt}\`, true);"`;
			var fdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
                <div class="flip-card-inner">
                    <div class="flip-card-front" onmouseenter="playCard('${h.play}')">
					    <span style="position:relative; display:flex; align-items:center; font-size:28px">
							${h.en[0]}
						</span>
                    </div>
                    <div class="flip-card-back">
                        <img style="opacity:0;top:24%; width:94%; height:76%" 
							 class="alpha-image" src="">
                        </img>
						<span style="position:relative; display:flex; align-items:center; font-size:30px">
							<a href="#" style="text-decoration:none; cursor:pointer;"
							 onclick="${onclick}">
								${h.names.map((n, i) => `${n}<br/><br/>`).join("")}
							</a>
						</span>
                    </div>
                </div>
            </div>`;
		    div.append($(fdiv));
		}
		
		function darwGreetings(div, h){             

			h.names.every(function(name, i){			
				var fdiv = `
				<div class="flip-card" style="border:4px solid transparent;">
					<div class="flip-card-inner">
						<div class="flip-card-front"
							 ontouchstart="playCard('${name}')" 
							 onmouseenter="playCard('${name}')">
							<span style="position:relative; display:flex; align-items:center; font-size:34px">
								${name}
							</span>
						</div>
						<div class="flip-card-back">
							<img style="opacity:0;top:24%; width:94%; height:76%" 
							     class="alpha-image" src="">
							</img>
							<span style="position:relative; display:flex; align-items:center; font-size:32px">
							<a href="#" style="text-decoration:none; cursor:pointer;"
								onclick="openGoogleAISearch(
								getPromptFromKey(['Greetings'], 
									{'0': ['${name}', '${h.en[i]}']}, true));">
								${h.en[i]}
							</a>
							</span>
						</div>
					</div>
				</div>`;
				div.append($(fdiv));
				return true;
			});
		}	
		
		function drawColors(div, color){
		
		  	var tooltip = color.en;		  		             
			var back= "", backColor = "", backStyle = "";
			backColor = 'color:'+invertColor(color.color);
			backStyle = 'style="background-color:'+color.color+';"';
			back = `
			<p style="font-size:38px;margin-top:50px;${backColor}">
				${color.names[1]}
				<br/><span style="font-size:28px;${backColor}">${color.en}</span>
				<br/><span style="font-size:32px;${backColor}">${color.ur}</span>
			</p>`;
							
			var cdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
				<div class="flip-card-inner">
					<div class="flip-card-front"
							ontouchstart="playCard('${color.names[0]}.${color.names[1]}')"
							onmouseenter="playCard('${color.names[0]}.${color.names[1]}')"
							${backStyle}>
						<p style="font-size:38px;margin-top:50px;${backColor};">
							${color.names[0]}
							<br/><span style="font-size:28px;${backColor};">${color.en}</span>
							<br/><span style="font-size:32px;${backColor};">${color.ur}</span>
						</p>
					</div>
					<div class="flip-card-back" ${backStyle}>${back}</div>
				</div>
			</div>`;
			div.append($(cdiv));
		} 
		
		function drawPronouns(div, p){             
		
			var fdiv = `
			<div class="flip-card" style="border:4px solid transparent;">
				<div class="flip-card-inner">
					<div class="flip-card-front">
						<span style="position:relative; display:flex; align-items:center; font-size:34px">
							${p.names[0]}<br/>${p.en[0]}
						</span>
					</div>
					<div class="flip-card-back"
						 ontouchstart="playCard('${p.names[0]}.${p.names[1]}')"
						 onmouseenter="playCard('${p.names[0]}.${p.names[1]}')" >
						<span style="position:relative; display:flex; align-items:center; font-size:32px">
							${p.names[1]}<br/>${p.en[1]}
						</span>
					</div>
				</div>
			</div>`;
		div.append($(fdiv));
	}	

	function toggleIcon(el){
		var img = $(el).find('img');
		if(img.prop('src').indexOf('menu-disabled') > -1){
			img.prop('src', 'images/menu-enabled.jpg');
			return 1;
		}else{
			img.prop('src', 'images/menu-disabled.jpg');
			return 0;
		}
	}
	function toggleCardImages(el){
		toggleIcon(el);
		$("#cardContainer .flip-card-front").toggleClass('flip-card-front flip-card-f');
		$("#cardContainer .flip-card-back").toggleClass('flip-card-back flip-card-front');
		$("#cardContainer .flip-card-f").toggleClass('flip-card-f flip-card-back');		
	}

	var playCardTimer = undefined;
	function stopPlayCards(elem){
			console.log('Stopping cards...');
			$(elem).html('▶');
			if(playCardTimer !== undefined)
				clearInterval(playCardTimer);
			playCardTimer = undefined;
			reloadCardData();
	}

	function playAllCards(elem){
		
		var state = $(elem).html().trim();
		console.log('state='+state);
		if(state == '⏹'){ // stop
			stopPlayCards(elem);
			return;
		}

		console.log('Playing cards...');
		$(elem).html('⏹'); //stop
		var cards = $(".flip-card").sort((a,b) => $(a).attr('number') >= $(b).attr('number'));
		
		var index = -1;
		playCardTimer = setInterval(() => {
			if(index < cards.length){				
				index++;

				var text = '';
				if( $(".bottom-right").length > 0 ){
					text = `${$(cards[index]).find(".top-right").html()} . ${$(cards[index]).find(".top-left").html()} . ${$(cards[index]).find(".bottom-right").html()} . ${$(cards[index]).find(".bottom-left").html()}`;
				}else{
					var textElem = $(cards[index]).find('span:last');
					if(textElem.find("a").length > 0){
						textElem = textElem.find("a");
					}
					text = textElem.html();
					if(text) {
						text = text.trim()
						if(text.includes("<br>")){
							text = text.split("<br>")[0];
						}
					}
				}
				console.log(`index: ${index}; text=${text}`);
				if(text == undefined || text == "undefined" || text == ""){
					return;
				}
				var bc = $(cards[index]).find(".flip-card-inner");
				var oldT = $(bc).css('transform');
				$(bc).css('transform', 'rotateY(180deg)');
				playCard(text);
				setTimeout(function(){
					$(bc).css('transform', oldT);
				}, 1500);
			}else{
				$(elem).html('▶');
				clearInterval(playCardTimer);
				playCardTimer = undefined;
				reloadCardData();
			}
		}, 2500, index);
	}
	</script>
</head>
  <body>
	<span style="text-align: middle; align-content: center;">
		<a href="#" style="text-decoration: none;" 
			title="Export to PDF"
			onclick="convertHTMLtoImage('#cardContainer', 
								        ['#cardContainer .flip-card-front',
									     '#cardContainer .flip-card-back'], 
										'exported-cards.pdf');">
			<img src="images/exp.png" style="width: 16px; height: 16px;"/>
		</a>
		<a href="#" style="text-decoration: none;" title="Toggle Images" 
			onclick=" toggleCardImages(this)">
			<img src="images/menu-disabled.jpg" style="width: 20px; height: 16px;" />
		</a>
		<a href="#" style="position:relative; top: -4px; left:4px; width: 20px; height: 16px;text-decoration: none;" 
			title="Play Cards"
			onclick="playAllCards(this)">▶</a>
	</span>
	<div class="image-preview" style="display: none;align-items: center;justify-content: center;"></div>
	<div id="cardContainer"></div>
</body>
</html>
